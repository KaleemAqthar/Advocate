<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Advocate [Name] | Trusted Legal Services in [City]
    </title>

    <meta
      name="description"
      content="Advocate [Name] provides professional legal representation and consultation in [City], including civil litigation, criminal law, family law, property law, corporate law and legal documentation."
    />

    <meta
      name="keywords"
      content="advocate in [City], lawyer in [City], legal services in [City], civil litigation lawyer, criminal lawyer, family lawyer, property lawyer, corporate lawyer, legal documentation, legal consultant"
    />

    <meta
      name="author"
      content="Advocate [Name]"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.yourdomain.com/"
    />

    <!-- Website Icon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Advocate [Name] | Trusted Legal Representation"
    />

    <meta
      property="og:description"
      content="Professional legal representation and consultation for civil, criminal, family, property, corporate and documentation matters."
    />

    <meta
      property="og:url"
      content="https://www.yourdomain.com/"
    />

    <meta
      property="og:site_name"
      content="Advocate [Name]"
    />

    <meta
      property="og:image"
      content="https://www.yourdomain.com/images/hero/hero-law-office.jpg"
    />

    <meta
      property="og:image:alt"
      content="Professional legal office and courtroom representation"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Advocate [Name] | Trusted Legal Representation"
    />

    <meta
      name="twitter:description"
      content="Professional legal services and representation in [City]."
    />

    <meta
      name="twitter:image"
      content="https://www.yourdomain.com/images/hero/hero-law-office.jpg"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#111111"
    />

    <!-- Preconnect -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Local Business / Legal Professional Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LegalService",
        "name": "Advocate [Name]",
        "url": "https://www.yourdomain.com/",
        "description": "Professional legal representation and consultation in [City].",
        "image": "https://www.yourdomain.com/images/hero/hero-law-office.jpg",
        "areaServed": {
          "@type": "City",
          "name": "[City]"
        },
        "serviceType": [
          "Civil Litigation",
          "Criminal Law",
          "Family Law",
          "Property Law",
          "Corporate Law",
          "Legal Documentation"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
